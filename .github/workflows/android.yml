name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anmu-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    name: Build QEMU for Android ARM64 host (AArch64 + x86_64 guests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned QEMU Android build recipe
        run: |
          git clone https://github.com/ExTV/Podroid.git /tmp/podroid
          git -C /tmp/podroid checkout e3fc1befa3c135d28bf8d40e3c2264d93fea87ef
          # Build both AArch64 and x86_64 guest machines; expose VNC for the in-app framebuffer.
          sed -i 's/--target-list=aarch64-softmmu/--target-list=aarch64-softmmu,x86_64-softmmu/; s/--disable-vnc/--enable-vnc/' /tmp/podroid/Dockerfile
          python3 - <<'PY'
          path = "/tmp/podroid/Dockerfile"
          source = open(path, encoding="utf-8").read()
          marker = "# SECTION 3: Final Artifacts Stage"
          addition = """RUN cp /opt/qemu-out/bin/qemu-system-x86_64 /opt/qemu-out/libqemu-system-x86_64.so \\
              && patchelf --set-soname libqemu-system-x86_64.so /opt/qemu-out/libqemu-system-x86_64.so \\
              && patchelf --replace-needed libslirp.so.0 libslirp.so /opt/qemu-out/libqemu-system-x86_64.so

          """
          if marker not in source:
              raise SystemExit("Could not find QEMU Dockerfile final-stage marker")
          source = source.replace(marker, addition + marker, 1)
          open(path, "w", encoding="utf-8").write(source)
          PY

      - name: Build AArch64 UEFI firmware
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm acpica-tools python3 python-is-python3 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          git clone --depth 1 --branch edk2-stable202505 https://github.com/tianocore/edk2.git /tmp/edk2
          git -C /tmp/edk2 submodule update --init --recursive
          make -C /tmp/edk2/BaseTools -j2
          cd /tmp/edk2
          export GCC5_AARCH64_PREFIX=aarch64-linux-gnu-
          . ./edksetup.sh
          build -a AARCH64 -t GCC5 -p ArmVirtPkg/ArmVirtQemu.dsc -b RELEASE -n 2
          mkdir -p /tmp/anmu-qemu-firmware
          firmware="$(find Build -name QEMU_EFI.fd -type f -print -quit)"
          test -n "$firmware"
          cp "$firmware" /tmp/anmu-qemu-firmware/QEMU_EFI.fd
          cp License.txt /tmp/anmu-qemu-firmware/EDK2-LICENSE.txt

      - name: Build QEMU runtime with Android NDK
        run: |
          docker build --progress=plain \
            --target qemu-builder \
            --build-arg QEMU_VERSION=11.1.2 \
            --tag anmu-qemu-builder \
            /tmp/podroid

      - name: Collect QEMU runtime and firmware
        run: |
          set -euo pipefail
          mkdir -p dist/qemu/lib/arm64-v8a dist/qemu/assets/qemu
          container_id="$(docker create anmu-qemu-builder)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/opt/qemu-out/libqemu-system-aarch64.so" dist/qemu/lib/arm64-v8a/
          docker cp "$container_id:/opt/qemu-out/libqemu-system-x86_64.so" dist/qemu/lib/arm64-v8a/
          docker cp "$container_id:/opt/qemu-out/libslirp.so" dist/qemu/lib/arm64-v8a/
          docker cp "$container_id:/opt/qemu-out/libpodroid-launcher.so" dist/qemu/lib/arm64-v8a/
          docker cp "$container_id:/opt/qemu-out/share/qemu/." dist/qemu/assets/qemu/
          docker cp "$container_id:/qemu-11.1.2/COPYING" dist/qemu/assets/qemu/QEMU-COPYING.txt
          cp /tmp/podroid/LICENSE dist/qemu/assets/qemu/PODROID-LICENSE.txt
          cp /tmp/anmu-qemu-firmware/QEMU_EFI.fd dist/qemu/assets/qemu/
          cp /tmp/anmu-qemu-firmware/EDK2-LICENSE.txt dist/qemu/assets/qemu/
          test -s dist/qemu/lib/arm64-v8a/libqemu-system-aarch64.so
          test -s dist/qemu/lib/arm64-v8a/libqemu-system-x86_64.so
          test -s dist/qemu/lib/arm64-v8a/libslirp.so

      - name: Upload QEMU runtime
        uses: actions/upload-artifact@v4
        with:
          name: anmu-qemu-arm64-dual-guest
          path: dist/qemu/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: qemu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download QEMU runtime
        uses: actions/download-artifact@v4
        with:
          name: anmu-qemu-arm64-dual-guest
          path: dist/qemu

      - name: Package QEMU runtime into Android app
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/qemu
          cp dist/qemu/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          chmod 755 app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so app/src/main/jniLibs/arm64-v8a/libqemu-system-x86_64.so app/src/main/jniLibs/arm64-v8a/libpodroid-launcher.so
          cp -R dist/qemu/assets/. app/src/main/assets/qemu/
          find app/src/main/jniLibs/arm64-v8a app/src/main/assets/qemu -type f -printf '%p %s bytes\\n'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        env:
          ANDROID_NDK_VERSION: 27.2.12479018

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anmu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
